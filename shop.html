<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop</title>
    <meta
      name="description"
      content="Shop pet tech and non-ingestible wellness products. Filter by pet type, category, life stage, and size to find the right fit."
    />
    <link rel="canonical" href="/shop.html" />
    <link rel="stylesheet" href="styles/styles.css" />
    <style>
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      header nav ul {
        list-style: none;
        display: flex;
        gap: 14px;
        padding: 0;
        margin: 0;
      }

      header nav a {
        color: inherit;
        text-decoration: none;
      }

      header nav a:hover {
        text-decoration: underline;
      }

      header > div {
        white-space: nowrap;
      }

      #product-list a {
        color: inherit;
        text-decoration: none;
        display: block;
      }

      #product-list a:hover h2 {
        text-decoration: underline;
      }

      #product-list img {
        width: 100%;
        height: 260px;
        display: block;
        object-fit: cover;
        border-radius: 10px;
      }

      #product-list .product a > div {
        width: 100%;
        height: 260px;
        border-radius: 10px;
        overflow: hidden;
      }

      @media (max-width: 520px) {
        #product-list img {
          height: 220px;
        }

        #product-list .product a > div {
          height: 220px;
        }
      }

      main section > div {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 12px;
      }

      @media (max-width: 900px) {
        .shop-two-col {
          grid-template-columns: 1fr !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-mount" data-title="Shop"></div>

    <main>
      <section id="trust-strip" aria-label="Trust" style="max-width:1200px;margin:0 auto;padding:0 24px;"></section>
      <section style="max-width:1200px;margin:0 auto;padding:0 24px;">
        <div style="display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start;" class="shop-two-col">
          <aside id="starter-kits" aria-label="Starter kits"></aside>
          <div>
            <div style="margin:12px 0 16px;padding:12px 16px;background:#f3f4f6;border-radius:10px;font-size:0.95rem;">
              <strong>Not sure where to start?</strong>
              <a href="/content/senior-dog-mobility.html?ref=shop-banner" style="color:#111827;text-decoration:underline;">Read our Senior Dog Mobility Guide</a>
            </div>
            <h2>Products</h2>
            <div>
              <label for="pet-type">Pet:</label>
              <select id="pet-type">
                <option value="all">All</option>
                <option value="Dog">Dogs</option>
                <option value="Cat">Cats</option>
              </select>

              <label for="product-type">Category:</label>
              <select id="product-type">
                <option value="all">All</option>
                <option value="mobility-comfort">Mobility & Comfort</option>
                <option value="joint-support-topicals">Joint Support Topicals</option>
                <option value="calming-anxiety">Calming & Anxiety</option>
                <option value="smart-monitoring">Smart Monitoring</option>
                <option value="grooming-hygiene">Grooming & Hygiene</option>
              </select>

              <label for="life-stage">Life Stage:</label>
              <select id="life-stage">
                <option value="all">All</option>
                <option value="Puppy/Kitten">Puppy/Kitten</option>
                <option value="Adult">Adult</option>
                <option value="Senior">Senior</option>
              </select>

              <label for="size-req">Size:</label>
              <select id="size-req">
                <option value="all">All</option>
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="Large">Large</option>
              </select>
            </div>
            <div id="hero-banner"></div>
            <div id="product-list" class="grid"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
