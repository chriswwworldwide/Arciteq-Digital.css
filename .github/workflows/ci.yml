name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      FOSSA_API_KEY:
        required: false
  schedule:
    - cron: "0 2 * * *" # 🕑 Nightly 2AM UTC run

permissions:
  contents: read # ✅ read-only repository access

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # ---------------- Repository Setup ----------------
      - name: 🛎️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci --ignore-scripts
      # ---------------- Lint + Format ----------------
      - name: 🧹 Lint & Format Check
        run: npm run lint && npm run format:check
      # ---------------- Type Checking ----------------
      - name: 🧾 TypeScript Check
        if: always()
        run: npm run type-check
      # ---------------- Build Validation ----------------
      - name: 🏗️ Build Validation
        if: always()
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # ---------------- Unit / Integration Tests ----------------
      - name: 🧪 Run Tests with Coverage
        run: npm run test
      - name: 📈 Generate Coverage Badge
        run: |
          mkdir -p .github/badges
          npx coverage-badges save .github/badges/coverage.svg
      # ---------------- Upload Coverage Badge ----------------
      - name: Upload coverage reports without writing to the branch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: |
            coverage/
            .github/badges/coverage.svg
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # ---------------- Secrets Scan ----------------
      - name: 🕵️ Trufflehog Secrets Scan
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9
        with:
          version: 3.99.2
          extra_args: --results=verified,unknown

  filesystem-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # ---------------- Container Scan ----------------
      - name: 🧱 Container / IaC Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln,misconfig,secret
          ignore-unfixed: false
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # ---------------- Dependency Audit ----------------
      - name: 🛡️ Dependency Security Audit
        run: npm run audit && npm audit --audit-level=moderate

  license-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # ---------------- License Compliance ----------------
      - name: ⚖️ License Compliance (FOSSA)
        if: env.FOSSA_API_KEY != ''
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c
        with:
          api-key: ${{ env.FOSSA_API_KEY }}
          run-tests: true
      - name: Report optional license-service configuration
        if: env.FOSSA_API_KEY == ''
        run: echo '::notice::FOSSA is not configured; dependency, secrets and CodeQL scans run independently.'

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # ✅ needed for CodeQL uploads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # ---------------- CodeQL Static Analysis ----------------
      - name: 🧠 Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d

  runtime-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
      ADMIN_API_KEY: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
      PITCH_NOTIFY_TO: ci@example.test
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --include=dev
      - name: Start isolated test application
        id: server
        run: |
          npm start > /tmp/roxjaya-ci-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo '::error::Test application failed to start'
          exit 1
      - name: Verify public-file and authentication boundaries
        if: always() && steps.server.outcome == 'success'
        run: node scripts/security-smoke.mjs
      # ---------------- Runtime Security (DAST) ----------------
      - name: ⚔️ OWASP ZAP Baseline Scan
        if: always() && steps.server.outcome == 'success'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://localhost:3000 # change to your staging URL if needed
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          cmd_options: -a -m 1
          fail_action: true
          allow_issue_writing: false
      # ---------------- Performance & Accessibility --------------
      - name: 🚦 Lighthouse Performance Audit
        if: always() && steps.server.outcome == 'success'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          urls: http://localhost:3000 # replace with production/staging URL
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: ♿ Accessibility Scan
        if: always() && steps.server.outcome == 'success'
        run: npx --yes pa11y-ci@5.0.0 --config tests/.github/workflows/pa11yci.json
