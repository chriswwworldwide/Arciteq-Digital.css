<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Get in touch with L’art de la Séduction — we’re here to answer questions about orders, collections, and memberships."
    />
    <title>Contact Us | L’art de la Séduction</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles/main.css" />

    <!-- Favicon (optional) -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- Dynamic header include -->
    <div id="header-placeholder" class="loading">Loading header...</div>

    <main>
      <section class="contact-section">
        <h1>Contact Us</h1>
        <p>
          We’d love to hear from you. Whether you have a question about your
          order, a special request, or just want to say hello — our team is here
          to help.
        </p>

        <form
          class="contact-form"
          action="#"
          method="post"
          onsubmit="return false;"
        >
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="6"
              placeholder="Write your message here ..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn">Send Message</button>
        </form>

        <div class="contact-details">
          <p>
            Email:
            <a href="mailto:lartdelaseductionglobal@gmail.com"
              >lartdelaseductionglobal@gmail.com</a
            >
          </p>
          <p>Instagram: <a href="#">@lartdelaseduction</a></p>
        </div>

        <p><a href="index.html" class="btn secondary">← Back to Homepage</a></p>
      </section>
    </main>

    <!-- Dynamic footer include -->
    <div id="footer-placeholder" class="loading">Loading footer...</div>

    <script>
      // Load header.html and footer.html dynamically
      async function loadIncludes() {
        try {
          const [header, footer] = await Promise.all([
            fetch("header.html").then((res) => res.text()),
            fetch("footer.html").then((res) => res.text()),
          ]);
          document.getElementById("header-placeholder").innerHTML = header;
          document.getElementById("footer-placeholder").innerHTML = footer;
        } catch (err) {
          console.warn("Header or footer could not be loaded.", err);
        }
      }
      loadIncludes();
    </script>
  </body>
</html>
