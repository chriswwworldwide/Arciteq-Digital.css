name: PawVigil fortnightly freshness

on:
  schedule:
    - cron: "20 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Publish a guarded PawVigil guide when due
        run: node scripts/pawvigil-guide-autopilot.js
        env:
          GIT_PUBLISH: "true"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Persist the guide and sitemap source
        run: |
          if git diff --quiet -- content data/pawvigil-guides.json data/tenants.json; then exit 0; fi
          git add content data/pawvigil-guides.json data/tenants.json
          git -c user.name="PawVigil Guide Bot" -c user.email="actions@github.com" commit -m "Publish PawVigil safety guide"
          git push
