name: PawVigil fortnightly freshness

on:
  schedule:
    - cron: "20 9 * * 2"
  workflow_dispatch:

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish a guarded PawVigil guide when due
        run: node scripts/pawvigil-guide-autopilot.js
        env:
          SITE_URL: https://pawvigil.com
          ADMIN_API_KEY: ${{ secrets.ROXJAYA_ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
