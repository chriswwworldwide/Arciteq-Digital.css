<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Kits</title>
    <meta
      name="description"
      content="Browse dog starter kits built around common needs. Add a whole kit to your cart in one tap."
    />
    <link rel="canonical" href="/kits/dog.html" />
    <link rel="stylesheet" href="/styles/styles.css" />
    <style>
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      header nav ul {
        list-style: none;
        display: flex;
        gap: 14px;
        padding: 0;
        margin: 0;
      }

      header nav a {
        color: inherit;
        text-decoration: none;
      }

      header nav a:hover {
        text-decoration: underline;
      }

      header > div {
        white-space: nowrap;
      }

      .guide-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 12px;
      }

      @media (max-width: 700px) {
        .guide-grid {
          grid-template-columns: 1fr;
        }
      }

      .guide-card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        overflow: hidden;
      }

      .guide-card a {
        display: block;
        padding: 14px;
        color: inherit;
        text-decoration: none;
      }

      .guide-card a:hover {
        text-decoration: underline;
      }

      .guide-card h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .guide-card p {
        margin: 8px 0 0;
        color: #374151;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div id="header-mount" data-title="Dog Kits"></div>

    <main>
      <section
        id="trust-strip"
        aria-label="Trust"
        style="max-width: 1200px; margin: 0 auto; padding: 0 24px;"
      ></section>
      <section style="max-width: 1200px; margin: 0 auto; padding: 0 24px; margin-top: 14px;">
        <div style="font-weight: 800; font-size: 1.1rem;">Guides (quick reads)</div>
        <div style="margin-top: 6px; color: #374151; line-height: 1.45;">
          Simple, practical pages that help you pick the right setup fast.
        </div>
        <div class="guide-grid">
          <div class="guide-card">
            <a href="/kits/senior-dog-comfort.html">
              <h2>Senior Dog Comfort</h2>
              <p>Reduce stiffness, improve rest, and build a calmer routine.</p>
            </a>
          </div>
          <div class="guide-card">
            <a href="/kits/night-walk-safety-dog.html">
              <h2>Night Walk Safety</h2>
              <p>Visibility, calm control, and peace of mind on evening walks.</p>
            </a>
            <a
              href="/shop.html?featured=1"
              style="display: block; padding: 0 14px 14px; color: inherit; text-decoration: none; font-weight: 700;"
              >Open featured picks →</a>
          </div>
        </div>
      </section>
      <section style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
        <div id="kits-landing" data-kits-pet="Dog"></div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
