name: Manual combined checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-checks:
    permissions:
      contents: read
      actions: read
      security-events: write
    # 8️⃣ License Compliance (optional: requires FOSSA_API_KEY secret)
    # 9️⃣ Advanced Static Security — CodeQL
    uses: ./.github/workflows/ci.yml
    secrets: inherit
