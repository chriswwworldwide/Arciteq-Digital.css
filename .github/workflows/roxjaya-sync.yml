name: Roxjaya daily check + weekly digest

# Daily: read hyrox.com's Asia-Pacific listing and drop new/changed race dates
# into Dina's approve queue on the live site. Monday: ask the site to email her
# the "what needs you" digest. Both skip quietly until the two secrets exist.

on:
  schedule:
    - cron: "15 22 * * *" # 05:15 Jakarta, daily
    - cron: "0 0 * * 1" # 07:00 Jakarta, Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule == '15 22 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover Asia race dates -> approve queue
        env:
          SITE_URL: ${{ secrets.ROXJAYA_SITE_URL }}
          ADMIN_API_KEY: ${{ secrets.ROXJAYA_ADMIN_KEY }}
        run: node roxjaya/automation/hyrox-sync.js
      - name: Discover and publish Hyrox Asia news
        env:
          AUTO_PUBLISH: "true"
        run: node roxjaya/automation/news-sync.js
      - name: Persist published news
        run: |
          if git diff --quiet -- roxjaya/data/news.json; then exit 0; fi
          git add roxjaya/data/news.json
          git -c user.name="Roxjaya News Bot" -c user.email="actions@github.com" commit -m "Publish Roxjaya news updates"
          git push

  digest:
    runs-on: ubuntu-latest
    # On hold (owner on leave): flip back to the schedule condition to resume.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send weekly digest
        env:
          SITE_URL: ${{ secrets.ROXJAYA_SITE_URL }}
          ADMIN_API_KEY: ${{ secrets.ROXJAYA_ADMIN_KEY }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$ADMIN_API_KEY" ]; then
            echo "ROXJAYA_SITE_URL / ROXJAYA_ADMIN_KEY not set - skipping digest"; exit 0; fi
          node roxjaya/automation/hyrox-sync.js --digest

  guide-autopilot:
    # Fortnightly freshness: runs every Monday, the script itself skips if the
    # newest guide is under 13 days old.
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node roxjaya/automation/guide-autopilot.js
        env:
          SITE_URL: ${{ secrets.ROXJAYA_SITE_URL }}
          ADMIN_API_KEY: ${{ secrets.ROXJAYA_ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
