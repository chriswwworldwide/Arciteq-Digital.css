<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>L’Art de la Séduction — Amour Noir Edition</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&family=Bebas+Neue&family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --deep: #8b0f20;
        --rasp: #c52241;
        --gold: #d9b43e;
        --darkred: #2a0508;
        --darkerred: #0a0001;
        --f-logo: "Italianno", cursive;
        --f-display: "Bebas Neue", sans-serif;
        --f-body: "Manrope", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        font-family: var(--f-body);
        background: #fff;
        color: #000;
        overflow-x: hidden;
        line-height: 1.4;
      }

      img {
        pointer-events: none;
        user-select: none;
      }

      /* ------------------------------------------------------------- HEADER */
      header {
        text-align: center;
        padding: 2.5rem 1rem 1.2rem;
      }

      header h1 {
        font-family: var(--f-logo);
        font-size: 4.8rem;
        color: #000;
        text-shadow:
          -0.5px -0.5px 0 var(--deep),
          0.5px -0.5px 0 var(--deep),
          -0.5px 0.5px 0 var(--deep),
          0.5px 0.5px 0 var(--deep);
      }

      .tagline-line {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-top: 1rem;
      }

      .coming-soon {
        font-family: var(--f-logo);
        font-size: 26pt;
        color: #cc0066;
      }

      form {
        display: flex;
      }

      input[type="email"] {
        height: 2.2rem;
        padding: 0 1rem;
        border: 1px solid #aaa;
        border-radius: 4px 0 0 4px;
      }

      button {
        height: 2.2rem;
        border: 0;
        border-radius: 0 4px 4px 0;
        padding: 0 1.2rem;
        background: linear-gradient(140deg, var(--rasp), var(--deep));
        color: #fff;
        font-weight: 600;
        text-transform: uppercase;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.85;
      }

      /* ------------------------------------------------------------- NAV */
      .gold-panel {
        background: var(--gold);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 1.3rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .gold-links {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .gold-links a {
        color: #000;
        text-decoration: none;
      }

      .icon-strip {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #000;
      }

      .icon-strip svg {
        width: 16px;
        height: 16px;
        stroke: #000;
        stroke-width: 1.6;
        fill: none;
        stroke-linecap: round;
      }

      .icon-strip span {
        font-size: 14px;
      }

      /* ------------------------------------------------------------- HERO */
      .hero-section {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 0;
      }

      .hero-frame {
        position: relative;
        max-width: 520px;
        width: 38%;
        aspect-ratio: 3/4;
        border: 10pt solid #fff;
        outline: 1px solid var(--deep);
        overflow: hidden;
      }

      .hero-frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition:
          transform 2s ease-in-out,
          opacity 1.5s ease-in-out;
      }

      .hero-frame img.front {
        z-index: 2;
        opacity: 1;
      }

      .hero-frame img.back {
        z-index: 1;
        opacity: 0;
      }

      /* ------------------------------------------------------------- NEW ARRIVALS */
      .section-title {
        font-family: var(--f-display);
        font-weight: 400;
        font-size: 2.3rem;
        text-align: center;
        margin-bottom: 1.2rem;
      }

      .new-arrivals {
        text-align: center;
        margin: 2.5rem auto;
      }

      .carousel-wrapper {
        position: relative;
        height: 420px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .carousel {
        position: relative;
        width: 100%;
        height: 420px;
        max-width: 1000px;
      }

      .carousel figure {
        position: absolute;
        width: 180px;
        height: 240px;
        background: #000;
        overflow: hidden;
        border: 1px solid #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        transition:
          left 2.5s ease,
          top 2.5s ease,
          transform 1s ease,
          border-color 1s ease;
      }

      .carousel figure.pop {
        transform: scale(1.25) translateY(-10px);
        border-color: var(--deep);
        z-index: 40;
      }

      .carousel img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .fade-layer {
        opacity: 0;
        transition: opacity 1.6s ease-in-out;
      }

      /* ------------------------------------------------------------- FEATURED */
      .featured {
        position: relative;
        width: 100%;
        color: #fff;
        overflow: hidden;
        background: linear-gradient(
          270deg,
          var(--darkerred),
          var(--darkred) 25%,
          var(--deep) 55%,
          var(--darkred) 80%,
          var(--darkerred)
        );
        background-size: 400% 400%;
        padding: 3rem 9.5vw;
        animation: gradShift 20s ease infinite;
      }

      @keyframes gradShift {
        0% {
          background-position: 0 50%;
        }

        50% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0 50%;
        }
      }

      .featured::after {
        content: "";
        position: absolute;
        inset: -50%;
        background: linear-gradient(
          120deg,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0) 20%,
          rgba(139, 15, 32, 0.15) 30%,
          rgba(139, 15, 32, 0.45) 45%,
          rgba(139, 15, 32, 0.7) 50%,
          rgba(139, 15, 32, 0.45) 55%,
          rgba(139, 15, 32, 0.15) 70%,
          rgba(0, 0, 0, 0) 80%,
          rgba(0, 0, 0, 0) 100%
        );
        background-size: 320% 100%;
        opacity: 0;
        filter: blur(30px);
        mix-blend-mode: screen;
        pointer-events: none;
        transform: translateX(-120%);
      }

      .featured.wave-right::after {
        animation: waveRight 4s cubic-bezier(0.25, 0.8, 0.25, 1) 1;
      }

      .featured.wave-left::after {
        animation: waveLeft 4s cubic-bezier(0.25, 0.8, 0.25, 1) 1;
      }

      @keyframes waveRight {
        0% {
          opacity: 0;
          transform: translateX(-180%);
        }

        15% {
          opacity: 1;
        }

        50% {
          opacity: 0.9;
          transform: translateX(150%);
        }

        95% {
          opacity: 0;
        }

        100% {
          opacity: 0;
          transform: translateX(180%);
        }
      }

      @keyframes waveLeft {
        0% {
          opacity: 0;
          transform: translateX(180%);
        }

        15% {
          opacity: 1;
        }

        50% {
          opacity: 0.9;
          transform: translateX(-150%);
        }

        95% {
          opacity: 0;
        }

        100% {
          opacity: 0;
          transform: translateX(-180%);
        }
      }

      /* featured grid items */
      .featured-inner {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, auto);
        gap: 2rem;
        max-width: 1000px;
        margin: 0 auto;
        transition: transform 0.5s ease;
      }

      .item {
        position: relative;
        background: #000;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
        aspect-ratio: 3/4;
        opacity: 0;
        transform: scale(0.98);
        transition:
          opacity 0.8s ease,
          transform 0.4s ease,
          border-color 0.4s ease,
          box-shadow 0.4s ease;
      }

      .item.visible {
        opacity: 1;
        transform: scale(1);
      }

      .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .item:hover {
        transform: scale(1.08) translateY(-10px);
        border-color: var(--rasp);
        box-shadow: 0 0 25px 8px rgba(197, 34, 65, 0.4);
        z-index: 5;
      }

      /* arrows repositioned outside grid midpoint */
      .scroll-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.25);
        color: var(--gold);
        font-size: 2rem;
        border: 2px solid var(--gold);
        line-height: 48px;
        text-align: center;
        cursor: pointer;
        z-index: 50;
        transition:
          transform 0.25s,
          color 0.3s,
          border-color 0.3s,
          background 0.3s;
      }

      .scroll-arrow:hover {
        color: #fff;
        border-color: #fff;
        background: rgba(0, 0, 0, 0.4);
        transform: translateY(-50%) scale(1.1);
      }

      .scroll-arrow.left {
        left: calc((100vw - 1000px) / 4 - 26px);
      }

      .scroll-arrow.right {
        right: calc((100vw - 1000px) / 4 - 26px);
      }

      /* ------------------------------------------------------------- FOOTER & TOGGLE */
      footer {
        background: #000;
        color: #fff;
        text-align: center;
        padding: 2rem 1rem;
        font-size: 1rem;
        letter-spacing: 0.05em;
      }

      #themeToggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
        background: var(--gold);
        color: #000;
        border: none;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.7rem 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      }

      #themeToggle:hover {
        background: var(--deep);
        color: #fff;
        transform: scale(1.1);
      }

      #themeName {
        position: fixed;
        bottom: 62px;
        right: 20px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 0.3rem 0.7rem;
        border-radius: 6px;
        font-size: 0.85rem;
        font-family: var(--f-body);
      }
    </style>
  </head>

  <body>
    <header>
      <h1>L’Art de la Séduction</h1>
      <div class="tagline-line">
        <p class="coming-soon">Coming Soon</p>
        <form>
          <input
            type="email"
            placeholder="Enter email address"
            required
          /><button type="submit">Notify Me</button>
        </form>
      </div>
    </header>

    <nav class="gold-panel">
      <div class="gold-links">
        <a href="#">Lingerie Sets</a><a href="#">Panties</a><a href="#">Bras</a
        ><a href="#">Hosiery</a><a href="#">Accessories</a>
        <a href="shop.html">Shop</a>
      </div>
    </nav>

    <section class="hero-section">
      <div class="hero-frame" id="heroFrame">
        <img class="front" /><img class="back" />
      </div>
    </section>

    <section class="new-arrivals">
      <h2 class="section-title">New Arrivals</h2>
      <div class="carousel-wrapper">
        <div class="carousel" id="archCarousel">
          <figure><img /><img class="fade-layer" /></figure>
          <figure><img /><img class="fade-layer" /></figure>
          <figure><img /><img class="fade-layer" /></figure>
          <figure><img /><img class="fade-layer" /></figure>
          <figure><img /><img class="fade-layer" /></figure>
        </div>
      </div>
    </section>

    <section class="featured" id="featuredSection">
      <h2 class="section-title">Featured</h2>
      <div class="scroll-arrow left" id="leftBtn">‹</div>
      <div class="scroll-arrow right" id="rightBtn">›</div>
      <div class="featured-inner" id="featGrid">
        <div class="item"><img /></div>
        <div class="item"><img /></div>
        <div class="item"><img /></div>
        <div class="item"><img /></div>
        <div class="item"><img /></div>
        <div class="item"><img /></div>
      </div>
    </section>

    <footer>
      <p>L’Art de la Séduction Global</p>
    </footer>
    <button id="themeToggle">NEXT THEME ›</button>
    <div id="themeName">Amour Noir</div>

    <script>
      const TOTAL = 140;
      const PLACEHOLDER =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          `<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900'>
            <rect width='100%' height='100%' fill='#f3f4f6'/>
            <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='#374151' font-family='Arial, sans-serif' font-size='34'>Image coming soon</text>
          </svg>`,
        );
      async function preload() {
        return Array.from({ length: Math.max(6, TOTAL) }, () => PLACEHOLDER);
      }
      class Pool {
        constructor(a) {
          this.all = a;
          this.av = [...a];
          this.used = new Set();
        }
        shuf(a) {
          for (let i = a.length; i; ) {
            const j = Math.floor(Math.random() * i--);
            [a[i], a[j]] = [a[j], a[i]];
          }
        }
        next() {
          if (!this.av.length) this.av = [...this.all];
          this.shuf(this.av);
          let p;
          do {
            p = this.av.pop();
          } while (this.used.has(p) && this.av.length);
          this.used.add(p);
          return p;
        }
        rel(x) {
          this.used.delete(x);
        }
      }

      preload().then((valid) => {
        if (!valid.length) return;
        const pool = new Pool(valid);

        /* HERO */
        const [front, back] = document.querySelectorAll("#heroFrame img");
        front.src = pool.next();
        back.src = pool.next();
        front.style.opacity = 1;
        function slideHero() {
          const n = pool.next();
          pool.rel(back.src);
          back.src = n;
          back.style.transition = "none";
          back.style.transform = "translateX(100%)";
          back.style.opacity = 1;
          void back.offsetWidth;
          back.style.transition = "transform 2s ease-in-out";
          back.style.transform = "translateX(0)";
          front.style.transition = "opacity 2s ease-in-out";
          front.style.opacity = 0.4;
          setTimeout(() => {
            front.style.opacity = 0;
            setTimeout(() => {
              const tmp = front.src;
              front.src = back.src;
              pool.rel(tmp);
              front.style.transition = "none";
              front.style.opacity = 1;
              back.src = tmp;
              back.style.transition = "none";
              back.style.transform = "translateX(100%)";
              back.style.opacity = 0;
              setTimeout(slideHero, 3000);
            }, 1400);
          }, 2000);
        }
        setTimeout(slideHero, 3000);

        /* NEW ARRIVALS */
        const figs = [...document.querySelectorAll("#archCarousel figure")];
        figs.forEach((f) => (f.querySelector("img").src = pool.next()));
        let order = [...figs];
        const pos = [
          { o: -2, t: 120, z: 10 },
          { o: -1, t: 80, z: 20 },
          { o: 0, t: 40, z: 30 },
          { o: 1, t: 80, z: 20 },
          { o: 2, t: 120, z: 10 },
        ];
        function layout() {
          order.forEach((f, i) => {
            const p = pos[i];
            f.style.left = `calc(50% + ${p.o * 100}px - 90px)`;
            f.style.top = p.t + "px";
            f.style.zIndex = p.z;
            f.classList.toggle("pop", p.o === 0);
          });
        }
        layout();
        function rotate() {
          const last = order.pop();
          order.unshift(last);
          layout();
          const t = order[0],
            b = t.querySelector("img:not(.fade-layer)"),
            f = t.querySelector(".fade-layer"),
            n = pool.next();
          pool.rel(b.src);
          f.src = n;
          f.style.opacity = 0;
          void f.offsetWidth;
          f.style.opacity = 1;
          setTimeout(() => {
            b.src = n;
            f.style.opacity = 0;
          }, 1500);
        }
        setInterval(rotate, 5600);

        /* FEATURED */
        const section = document.getElementById("featuredSection");
        const feats = [...document.querySelectorAll("#featGrid img")];
        const cards = [...document.querySelectorAll("#featGrid .item")];
        feats.forEach((im, i) => {
          im.src = pool.next();
          setTimeout(() => cards[i].classList.add("visible"), 120 * i);
        });

        function nudge(dir) {
          section.classList.remove("wave-left", "wave-right");
          void section.offsetWidth;
          section.classList.add(dir === "left" ? "wave-left" : "wave-right");
          const grid = document.getElementById("featGrid");
          grid.style.transition = "transform .35s ease";
          grid.style.transform = `translateX(${dir === "left" ? -25 : 25}px)`;

          setTimeout(() => {
            grid.style.transform = "translateX(0)";
            feats.forEach((img) => {
              const n = pool.next();
              pool.rel(img.src);
              const overlay = document.createElement("div");
              overlay.style.position = "absolute";
              overlay.style.inset = "0";
              overlay.style.background = `url('${n}') center/cover no-repeat`;
              overlay.style.opacity = "0";
              overlay.style.transition = "opacity 1.4s ease";
              img.parentNode.style.position = "relative";
              img.parentNode.appendChild(overlay);
              requestAnimationFrame(() => (overlay.style.opacity = "1"));
              setTimeout(() => {
                img.src = n;
                overlay.style.opacity = "0";
                setTimeout(() => overlay.remove(), 1400);
              }, 1300);
            });
          }, 350);
          setTimeout(
            () => section.classList.remove("wave-left", "wave-right"),
            4200,
          );
        }

        document.getElementById("leftBtn").onclick = () => nudge("left");
        document.getElementById("rightBtn").onclick = () => nudge("right");
      });

      /* === THEME TOGGLE === */
      const toggle = document.getElementById("themeToggle"),
        nameBox = document.getElementById("themeName");
      const themes = [
        {
          n: "Amour Noir",
          c: {
            "--deep": "#8b0f20",
            "--rasp": "#c52241",
            "--darkred": "#2a0508",
            "--darkerred": "#0a0001",
            "--gold": "#d9b43e",
          },
        },
        {
          n: "Amour Rouge",
          c: {
            "--deep": "#a30e23",
            "--rasp": "#e43752",
            "--darkred": "#4c040b",
            "--darkerred": "#160001",
            "--gold": "#ca2a37",
          },
        },
        {
          n: "Amour Or",
          c: {
            "--deep": "#b68a00",
            "--rasp": "#e4b400",
            "--darkred": "#402800",
            "--darkerred": "#1a0f00",
            "--gold": "#ffd700",
          },
        },
      ];
      let idx = 0;
      toggle.onclick = () => {
        idx = (idx + 1) % themes.length;
        const t = themes[idx];
        Object.entries(t.c).forEach(([k, v]) =>
          document.documentElement.style.setProperty(k, v),
        );
        nameBox.textContent = t.n;
      };
    </script>
  </body>
</html>
