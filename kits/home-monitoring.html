<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Monitoring Kit</title>
    <meta
      name="description"
      content="A simple home monitoring kit for peace of mind while you’re out. Add the whole kit to your cart in one tap."
    />
    <link rel="canonical" href="/kits/home-monitoring.html" />
    <link rel="stylesheet" href="/styles/styles.css" />
    <style>
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      header nav ul {
        list-style: none;
        display: flex;
        gap: 14px;
        padding: 0;
        margin: 0;
      }

      header nav a {
        color: inherit;
        text-decoration: none;
      }

      header nav a:hover {
        text-decoration: underline;
      }

      header > div {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="header-mount" data-title="Home Monitoring Kit"></div>

    <main>
      <section
        id="trust-strip"
        aria-label="Trust"
        style="max-width: 1200px; margin: 0 auto; padding: 0 24px;"
      ></section>
      <section style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
        <div id="kits-landing" data-kit-id="home-monitoring-both"></div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
