name: Claude Code Review (Direct API)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# ✅ Required so the workflow token can post comments
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # ensure full history for git diff
          persist-credentials: false

      - name: Install jq JSON parser
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Claude code review through API
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔍 Gathering changed files..."
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          echo "Files changed:"
          echo "$FILES"

          echo "" > review_output.txt
          while IFS= read -r -d '' FILE; do
            if [ -f "$FILE" ] && [ ! -L "$FILE" ]; then
              REAL=$(realpath -e -- "$FILE")
              case "$REAL" in "$GITHUB_WORKSPACE"/*) ;; *) continue ;; esac
              echo "Reviewing $FILE ..."
              CONTENT=$(head -c 12000 -- "$FILE" | sed 's/"/\\"/g')
              RESPONSE=$(curl --fail --silent --show-error https://api.anthropic.com/v1/messages \
                -H "x-api-key: $ANTHROPIC_API_KEY" \
                -H "content-type: application/json" \
                -d "{
                      \"model\": \"claude-3-5-sonnet-latest\",
                      \"max_tokens\": 400,
                      \"messages\": [
                        {\"role\": \"user\", \"content\": \"Please review the following file for potential issues, improvements, or best practices. Filename: $FILE\\n\\n$CONTENT\"}
                      ]
                    }" | jq -er '.content[0].text')
              echo "### 💬 Feedback for $FILE" >> review_output.txt
              echo "$RESPONSE" >> review_output.txt
              echo "" >> review_output.txt
            fi
          done < <(git diff --name-only -z "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")

      - name: 🗨️ Post Claude feedback as PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY=$(cat review_output.txt)
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -f body="$COMMENT_BODY"
