<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Checkout Cancelled</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Checkout Cancelled</h1>
      <nav>
        <ul>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="cart.html">Cart</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <p>Your payment wasn’t completed. Nothing was charged.</p>
      <p id="order"></p>
      <p>
        <a href="cart.html">Return to your cart</a>
      </p>
      <p>
        <button id="clear" type="button">Clear cart</button>
      </p>
    </main>

    <script>
      const params = new URLSearchParams(globalThis.location.search);
      const orderId = params.get("order_id");
      const el = document.getElementById("order");
      if (orderId && el) {
        el.textContent = `Order: ${orderId}`;
      }

      if (orderId) {
        fetch("/checkout/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order_id: orderId }),
        }).catch(() => {
          // ignore
        });
      }

      const clearBtn = document.getElementById("clear");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          try {
            localStorage.removeItem("cart");
          } catch {
            // ignore
          }
          globalThis.location.href = "/cart.html";
        });
      }
    </script>
  </body>
</html>
